<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Defense Flow</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    /* Custom Horizontal Scrollbar */
    #talent-viewport::-webkit-scrollbar {
      height: 8px;
    }

    #talent-viewport::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    #talent-viewport::-webkit-scrollbar-thumb {
      background: #38bdf8;
      border-radius: 10px;
    }

    #talent-viewport::-webkit-scrollbar-thumb:hover {
      background: #2563eb;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      /* Let clicks pass through to canvas */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px 25px;
      margin: 20px;
      pointer-events: auto;
      /* Enable clicks on panels */
      color: white;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #bottom-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .tower-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 2px solid transparent;
      border-radius: 8px;
      color: white;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .tower-btn:hover {
      background: rgba(51, 65, 85, 0.9);
      transform: translateY(-2px);
    }

    .tower-btn.selected {
      border-color: #38bdf8;
      background: rgba(14, 165, 233, 0.2);
    }

    .tower-btn .cost {
      font-size: 0.8rem;
      color: #fbbf24;
    }

    #context-menu {
      position: absolute;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
      z-index: 10;
      transform: translate(-50%, -100%);
      margin-top: -15px;
    }

    .ctx-btn {
      background: rgba(51, 65, 85, 0.8);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .ctx-btn:hover {
      background: rgba(71, 85, 105, 0.8);
    }

    .ctx-btn.upgrade {
      color: #4ade80;
    }

    .ctx-btn.sell {
      color: #f87171;
    }

    #wave-btn {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1rem;
      transition: background 0.2s;
    }

    #wave-btn:hover {
      background: #2563eb;
    }

    #wave-btn:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    #message-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      font-weight: 900;
      color: white;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
    }
     .cam-btn {
        width: 40px;
        height: 40px;
        background: rgba(15, 23, 42, 0.8);
        border: 2px solid rgba(56, 189, 248, 0.5);
        border-radius: 50%;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(5px);
    }
    .cam-btn:active {
        background: #38bdf8;
        transform: scale(0.9);
    }
    .dpad-btn {
        width: 50px !important;
        height: 50px !important;
        font-size: 1.2rem !important;
    }
    @media (max-width: 768px) {
    #top-bar { font-size: 0.9rem; padding: 10px; }
    .tower-btn { padding: 8px 12px; font-size: 0.8rem; }
    #talent-overlay h1 { font-size: 2rem !important; }
    }

    .tower-btn-small {
        width: 50px; height: 50px; border-radius: 8px; border: none;
        background: #1e293b; color: white; font-size: 1.5rem; cursor: pointer;
    }
    .tower-btn-small:active { background: #38bdf8; }
  </style>
</head>

<body>

  <div id="ui-layer">

    <div id="dpad" style="position: absolute; left: calc(100% / 2 - 80px); bottom: 20px; display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; pointer-events: auto;">
    <div></div>
    <button class="cam-btn dpad-btn" onpointerdown="startPan(0, -1)" onpointerup="stopPan()">▲</button>
    <div></div>
    
    <button class="cam-btn dpad-btn" onpointerdown="startPan(-1, 0)" onpointerup="stopPan()">◀</button>
    <div style="background: rgba(56, 189, 248, 0.2); border-radius: 50%;"></div>
    <button class="cam-btn dpad-btn" onpointerdown="startPan(1, 0)" onpointerup="stopPan()">▶</button>
    
    <div></div>
    <button class="cam-btn dpad-btn" onpointerdown="startPan(0, 1)" onpointerup="stopPan()">▼</button>
    <div></div>
</div>

    <div id="top-bar" class="panel">
      <div class="stat"><span style="color:#fbbf24">💰 Gold:</span> <span id="gold-display">100</span></div>
      <div class="stat"><span style="color:#f87171">❤️ Lives:</span> <span id="lives-display"></span></div>
      <div class="stat"><span style="color:#60a5fa">🌊 Wave:</span> <span id="wave-display">1</span></div>
      <button id="wave-btn">Start Wave</button>
    </div>

    <div id="camera-controls" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px; pointer-events: auto;">
    <button class="cam-btn" onclick="window.tdGameInstance.adjustZoom(-5)">➕</button>
    <button class="cam-btn" onclick="window.tdGameInstance.adjustZoom(5)">➖</button>
    <div style="height: 10px;"></div>
    <button class="cam-btn" onclick="window.tdGameInstance.rotateCamera(-15)">🔄</button>
    <button class="cam-btn" onclick="window.tdGameInstance.rotateCamera(15)">🔃</button>
  
</div>
 
    <div id="context-menu">
    <div id="ctx-title" style="color: white; font-weight: bold; text-align: center; margin-bottom: 5px;">Tower lvl 1
    </div>
    <button id="btn-upgrade" class="ctx-btn upgrade">Upgrade (50g)</button>
    <button id="btn-sell" class="ctx-btn sell">Sell (25g)</button>
    <button id="btn-close" class="ctx-btn" onclick="closeContextMenu()">Close</button>
  </div>
  </div>



  <div id="message-overlay">GAME OVER</div>

  <div id="talent-overlay"
    style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,1.0); z-index:20000; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-family:sans-serif;">
    <h1 style="color:#38bdf8; font-size:3rem; margin-bottom:10px;">TALENT TREE</h1>
    <div style="margin-bottom:20px; font-size:1.5rem;">Available XP: <span id="xp-count" style="color:#4ade80">0</span>
    </div>
    <div id="talent-viewport"
      style="width: 90%; max-width: 1200px; overflow-x: auto; padding: 20px 0; margin-bottom: 30px; scroll-behavior: smooth;">
      <div id="talent-container" style="display: flex; gap: 20px; flex-wrap: nowrap; align-items: flex-start;">
      </div>
    </div>


    <button onclick="startGame()"
      style="padding:15px 40px; font-size:1.5rem; background:#4ade80; color:#0f172a; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">START
      GAME</button>
  </div>

  <div id="build-menu" style="position: absolute; display: none; flex-direction: column; gap: 5px; pointer-events: auto; z-index: 100; transform: translate(-50%, -50%);">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 12px; border: 1px solid #38bdf8;">
        <button class="tower-btn-small" onclick="placeTowerAtSelected('fire')">🔥</button>
        <button class="tower-btn-small" onclick="placeTowerAtSelected('ice')">❄️</button>
        <button class="tower-btn-small" onclick="placeTowerAtSelected('poison')">☠️</button>
        <button class="tower-btn-small" onclick="placeTowerAtSelected('electric')">⚡</button>
    </div>
</div>



  <!-- We will bundle main.ts into dist/bundle.js or similar based on flow Rollup config -->
  <!-- Assuming SoT's Rollup config for flows produces an IIFE or ES module -->
  <script type="module">
    import { TDGame } from "./compiled.js";

    const TALENT_DATA = [
      {
        id: 'startingGold',
        name: 'Deep Pockets',
        description: 'Start each game with extra gold.',
        bonusPerLevel: 50,
        baseCost: 10,
        icon: '💰'
      },
      {
        id: 'waveBonus',
        name: 'Veteran Bonus',
        description: 'Earn more gold at the end of each wave.',
        bonusPerLevel: 20,
        baseCost: 15,
        icon: '🌊'
      },
      {
        id: 'towerRange',
        name: 'Eagle Eye',
        description: 'All towers gain +5% attack range.',
        bonusPerLevel: 0.05,
        baseCost: 25,
        icon: '🎯'
      },
      {
        id: 'towerAttackSpeed',
        name: 'Cheetah Speed',
        description: 'All towers gain +5% attack speed.',
        bonusPerLevel: 0.05,
        baseCost: 25,
        icon: '🐆'
      },
      {
        id: "chillingTouch",
        name: "Chilling Touch",
        description: "Ice towers apply greater slow to enemies.",
        bonusPerLevel: 0.1,
        baseCost: 20,
        icon: "❄️"
      },
      {
        id: "burningTouch",
        name: "Burning Touch",
        description: "Fire towers apply greater burn to enemies.",
        bonusPerLevel: 0.1,
        baseCost: 20,
        icon: "🔥"
      },
      {
        id: "corrosiveTouch",
        name: "Corrosive Touch",
        description: "Poison towers apply greater poison to enemies.",
        bonusPerLevel: 0.1,
        baseCost: 20,
        icon: "☠️"
      },
      {
        id: "electrifyingTouch",
        name: "Electrifying Touch",
        description: "Electric towers apply greater shock to enemies.",
        bonusPerLevel: 0.1,
        baseCost: 20,
        icon: "⚡"
      },

    ];
    // Expose UI functions to global scope so the flow game can access them, or just use events.
    window.selectedTowerType = null;

    window.selectTower = function (type) {
      document.querySelectorAll('.tower-btn').forEach(btn => btn.classList.remove('selected'));
      if (window.selectedTowerType === type) {
        window.selectedTowerType = null; // deselect
      } else {
        window.selectedTowerType = type;
        document.querySelector(`.tower-btn[data-type="${type}"]`).classList.add('selected');
      }
    };

    window.closeContextMenu = function () {
      document.getElementById('context-menu').style.display = 'none';
      if (window.tdGameInstance) {
        window.tdGameInstance.deselectTower();
      }
    };

    window.placeTowerAtSelected = function(type) {
    const game = window.tdGameInstance;
    const menu = document.getElementById('build-menu');
    
    if (game && game.pendingGridPos) {
        const {x, z} = game.pendingGridPos;
        
        // Call the internal method we just created
        const success = game.spawnTower(type, x, z);
        
        if (!success) {
            // If spawnTower returned false, it was either gold or pathing
            window.showAlert("Cannot build here (Check gold/path)!");
        }
    }
    
    // Hide menu regardless of success
    menu.style.display = 'none';
};

    window.buyTalent = function (talentId) {
      const saved = JSON.parse(localStorage.getItem('td_meta_data') || '{"xp":0, "talents":{}}');
      const talent = TALENT_DATA.find(t => t.id === talentId);

      const level = saved.talents[talentId] || 0;
      const cost = Math.floor(talent.baseCost * Math.pow(3.5, level));

      if (saved.xp >= cost) {
        saved.xp -= cost;
        saved.talents[talentId] = level + 1;
        localStorage.setItem('td_meta_data', JSON.stringify(saved));
        refreshTalentUI();
        window.showAlert("Upgraded " + talent.name + "!", true);
      } else {
        window.showAlert("Need " + cost + " XP for next level!");
      }
    };

    window.refreshTalentUI = function () {
      const saved = JSON.parse(localStorage.getItem('td_meta_data') || '{"xp":0, "talents":{}, "gold":100, "lives":20}');
      document.getElementById('xp-count').innerText = saved.xp;

      const container = document.getElementById('talent-container');
      container.innerHTML = '';

      TALENT_DATA.forEach(talent => {
        const level = saved.talents[talent.id] || 0;
        const cost = Math.floor(talent.baseCost * Math.pow(3.5, level));

        const card = document.createElement('div');
        card.className = 'panel';
        // CRITICAL: flex-shrink: 0 keeps the card at 220px regardless of how many there are
        card.style.cssText = 'width: 220px; flex-shrink: 0; text-align: center; margin: 0;';

        card.innerHTML = `
            <div style="font-size:2rem;">${talent.icon}</div>
            <h3>${talent.name}</h3>
            <p style="font-size:0.8rem; color:#94a3b8; height:40px;">${talent.description}</p>
            <div style="margin-bottom:10px; font-weight:bold; color:#38bdf8;">Lvl: ${level}</div>
            <button onclick="buyTalent('${talent.id}')" style="background:#3b82f6; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; width:100%;">
                <span id="btn-${talent.id}-text">Upgrade (${cost} XP)</span>
            </button>
        `;
        container.appendChild(card);
      });
    };

    window.startGame = function () {
      document.getElementById('talent-overlay').style.display = 'none';
      // The TDGame constructor in your .flow file will read these stats from localStorage
      if (!window.tdGameInstance) {
        window.tdGameInstance = new TDGame();
      }
    };

    window.showAlert = function (message) {
      const alertBox = document.getElementById('custom-alert');
      const messageEl = document.getElementById('alert-message');

      messageEl.innerText = message;
      alertBox.style.transform = 'translateX(0)'; // Slide in

      // Hide it automatically after 3 seconds
      setTimeout(() => {
        alertBox.style.transform = 'translateX(150%)'; // Slide out
      }, 3000);
    };

    // Initial Load
    refreshTalentUI();

    let panInterval = null;

    window.startPan = function(dx, dz) {
        if (panInterval) clearInterval(panInterval);
        // Pan every 16ms (roughly 60fps)
        panInterval = setInterval(() => {
            if (window.tdGameInstance) {
                window.tdGameInstance.pan(dx, dz);
            }
        }, 16);
    };

    window.stopPan = function() {
        clearInterval(panInterval);
        panInterval = null;
    };

    // Also stop panning if the finger leaves the button area
    window.addEventListener('pointerup', window.stopPan);
  </script>



  <div id="custom-alert"
    style="position: fixed; bottom: 20px; right: 20px; background: rgba(248, 113, 113, 0.95); color: white; padding: 15px 25px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-weight: bold; transform: translateX(150%); transition: transform 0.3s ease-out; z-index: 30000; display: flex; align-items: center; gap: 10px;">
    <span style="font-size: 1.5rem;">⚠️</span>
    <span id="alert-message">Not enough XP!</span>
  </div>


</body>

</html>
