<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Defense Flow</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      /* Let clicks pass through to canvas */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px 25px;
      margin: 20px;
      pointer-events: auto;
      /* Enable clicks on panels */
      color: white;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #bottom-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .tower-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 2px solid transparent;
      border-radius: 8px;
      color: white;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .tower-btn:hover {
      background: rgba(51, 65, 85, 0.9);
      transform: translateY(-2px);
    }

    .tower-btn.selected {
      border-color: #38bdf8;
      background: rgba(14, 165, 233, 0.2);
    }

    .tower-btn .cost {
      font-size: 0.8rem;
      color: #fbbf24;
    }

    #context-menu {
      position: absolute;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
      z-index: 10;
      transform: translate(-50%, -100%);
      margin-top: -15px;
    }

    .ctx-btn {
      background: rgba(51, 65, 85, 0.8);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .ctx-btn:hover {
      background: rgba(71, 85, 105, 0.8);
    }

    .ctx-btn.upgrade {
      color: #4ade80;
    }

    .ctx-btn.sell {
      color: #f87171;
    }

    #wave-btn {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1rem;
      transition: background 0.2s;
    }

    #wave-btn:hover {
      background: #2563eb;
    }

    #wave-btn:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    #message-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      font-weight: 900;
      color: white;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
    }
  </style>
</head>

<body>

  <div id="ui-layer">
    <div id="top-bar" class="panel">
      <div class="stat"><span style="color:#fbbf24">💰 Gold:</span> <span id="gold-display">100</span></div>
      <div class="stat"><span style="color:#f87171">❤️ Lives:</span> <span id="lives-display">20</span></div>
      <div class="stat"><span style="color:#60a5fa">🌊 Wave:</span> <span id="wave-display">1</span></div>
      <button id="wave-btn">Start Wave</button>
    </div>

    <div id="bottom-bar" class="panel">
      <button class="tower-btn" data-type="fire" onclick="selectTower('fire')">
        🔥 Fire Tower
        <span class="cost">20g</span>
      </button>
      <button class="tower-btn" data-type="ice" onclick="selectTower('ice')">
        ❄️ Ice Tower
        <span class="cost">20g</span>
      </button>
      <button class="tower-btn" data-type="poison" onclick="selectTower('poison')">
        ☠️ Poison Tower
        <span class="cost">20g</span>
      </button>
      <button class="tower-btn" data-type="electric" onclick="selectTower('electric')">
        ⚡ Electric Tower
        <span class="cost">20g</span>
      </button>
    </div>
  </div>

  <div id="context-menu">
    <div id="ctx-title" style="color: white; font-weight: bold; text-align: center; margin-bottom: 5px;">Tower lvl 1
    </div>
    <button id="btn-upgrade" class="ctx-btn upgrade">Upgrade (50g)</button>
    <button id="btn-sell" class="ctx-btn sell">Sell (25g)</button>
    <button id="btn-close" class="ctx-btn" onclick="closeContextMenu()">Close</button>
  </div>

  <div id="message-overlay">GAME OVER</div>

  <!-- We will bundle main.ts into dist/bundle.js or similar based on flow Rollup config -->
  <!-- Assuming SoT's Rollup config for flows produces an IIFE or ES module -->
  <script type="module">
    // Expose UI functions to global scope so the flow game can access them, or just use events.
    window.selectedTowerType = null;

    window.selectTower = function (type) {
      document.querySelectorAll('.tower-btn').forEach(btn => btn.classList.remove('selected'));
      if (window.selectedTowerType === type) {
        window.selectedTowerType = null; // deselect
      } else {
        window.selectedTowerType = type;
        document.querySelector(`.tower-btn[data-type="${type}"]`).classList.add('selected');
      }
    };

    window.closeContextMenu = function () {
      document.getElementById('context-menu').style.display = 'none';
      if (window.tdGameInstance) {
        window.tdGameInstance.deselectTower();
      }
    };
  </script>

  <script type="module">
    import { TDGame } from "./compiled.js";
    const game = new TDGame();
  </script>
</body>

</html>
